name: Build and Release Public APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable could not be detected."
            exit 1
          fi
          java -version
          JAVA_VER_STR=$(java -version 2>&1 | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$JAVA_VER_STR" ]; then
            echo "::error::Unable to parse active Java version."
            exit 1
          fi
          JAVA_MAJOR=$(echo "$JAVA_VER_STR" | cut -d. -f1)
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_VER_STR" | cut -d. -f2)
          fi
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Detected Java major version '$JAVA_MAJOR' is not numeric."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but found Java $JAVA_MAJOR."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore detected; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME:+$JAVA_HOME/bin/}keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN=$(command -v keytool || true)
            fi
            if [ -z "$KEYTOOL_BIN" ]; then
              echo "::error::keytool could not be found in configured Java installation."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Temporary ./debug.keystore does not exist after generation step."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Extract App Metadata and Rename APK
        id: metadata
        run: |
          APP_VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -z "$APP_VERSION" ] && [ -f "gradle/libs.versions.toml" ]; then
            APP_VERSION=$(grep -E '^(versionName|appVersion)\s*=' gradle/libs.versions.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi
          APP_VERSION="${APP_VERSION:-1.0}"

          RAW_NAME=""
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            RAW_NAME=$(grep -E '<string name="app_name">' app/src/main/res/values/strings.xml | head -n 1 | sed -E 's/.*<string name="app_name">([^<]+)<\/string>.*/\1/' || true)
          fi
          if [ -z "$RAW_NAME" ] && [ -f "settings.gradle.kts" ]; then
            RAW_NAME=$(grep -E 'rootProject\.name\s*=' settings.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi
          APP_NAME=$(echo "${RAW_NAME:-AndroidApp}" | sed -E 's/[^A-Za-z0-9._-]+//g')
          if [ -z "$APP_NAME" ]; then
            APP_NAME="AndroidApp"
          fi

          APK_FILE_NAME="${APP_NAME}-v${APP_VERSION}.apk"
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET_APK="app/build/outputs/apk/debug/${APK_FILE_NAME}"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "::error::Expected built APK not found at $SOURCE_APK"
            exit 1
          fi

          cp "$SOURCE_APK" "$TARGET_APK"

          if [ ! -f "$TARGET_APK" ]; then
            echo "::error::Failed to create renamed APK at $TARGET_APK"
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APK_FILE_NAME=$APK_FILE_NAME" >> "$GITHUB_ENV"

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_file_name=$APK_FILE_NAME" >> "$GITHUB_OUTPUT"

          echo "Prepared APK: $APK_FILE_NAME"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ env.APP_VERSION }}
          path: app/build/outputs/apk/debug/${{ env.APK_FILE_NAME }}
          if-no-files-found: error

      - name: Prepare APK release asset and changelog
        id: prepare_release
        run: |
          RELEASE_DIR=$(mktemp -d)
          SOURCE_APK="app/build/outputs/apk/debug/${APK_FILE_NAME}"
          ASSET_PATH="${RELEASE_DIR}/${APK_FILE_NAME}"
          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Failed to copy release APK to temporary directory."
            exit 1
          fi

          RELEASE_NOTES=""
          if [ -f "CHANGELOG.md" ]; then
            RELEASE_NOTES=$(awk '/^## Monoboard /{if (found) exit; found=1; next} found{print}' CHANGELOG.md | sed '/^[[:space:]]*$/d' || true)
          fi
          COMMITS=$(git log -n 5 --pretty=format:"- %s (%h)" || echo "- Automated open-source build")
          if [ -n "$RELEASE_NOTES" ]; then
            CHANGELOG="${RELEASE_NOTES}"
          elif [ -n "$COMMITS" ]; then
            CHANGELOG="${COMMITS}"
          else
            CHANGELOG="- Automated open-source build"
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to Public GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ steps.prepare_release.outputs.changelog }}
        run: |
          TAG="v${APP_VERSION}-build-${{ github.run_number }}"
          TITLE="Monoboard ${APP_VERSION}"

          NOTES_FILE=$(mktemp)
          {
            echo "## 📢 What's New in Monoboard ${APP_VERSION}"
            printf '%s\n' "$CHANGELOG"
            echo ""
            echo "## 🌐 Open Source Build"
            echo "Built publicly by GitHub Actions."
            echo ""
            echo "- **Release:** Monoboard ${APP_VERSION}"
            echo "- **APK:** ${APK_FILE_NAME}"
            echo "- **Run Number:** #${{ github.run_number }}"
            echo "- **Commit SHA:** ${{ github.sha }}"
          } > "$NOTES_FILE"

          gh release create "$TAG" "${{ steps.prepare_release.outputs.asset_path }}" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${{ github.sha }}" \
            --latest
